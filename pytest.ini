[pytest]
# Só a suíte da squad. Sem `testpaths`, um `pytest` na raiz varreria também
# `workspace/<thread_id>/tests/` — as suítes das entregas geradas, que importam
# módulos que só existem dentro do sandbox e falhariam na coleta.
testpaths = tests
norecursedirs = .venv workspace metrics docker .git .idea
