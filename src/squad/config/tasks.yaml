# Tarefas de cada crew. Placeholders {pedido}, {spec}, {codigo}, {feedback_qa},
# {arquivos}, {saida_testes} são preenchidos pelo nó do LangGraph via inputs
# do kickoff().

# --- Crew de planejamento ---
levantar_requisitos:
  description: >
    Analise o pedido a seguir e produza requisitos funcionais e não funcionais,
    com critérios de aceite verificáveis. Pedido: {pedido}
  expected_output: Lista numerada de requisitos com critérios de aceite.
  agent: analista_requisitos

definir_arquitetura:
  description: >
    Defina a solução técnica EXCLUSIVAMENTE para o pedido: "{pedido}".
    Use os requisitos levantados na tarefa anterior (fornecidos no contexto)
    como única fonte — não invente requisitos, funcionalidades ou domínios que
    não estejam neles. Se um requisito do contexto não se aplicar, ignore-o em
    vez de substituí-lo por outro tema. Produza: componentes, contratos de API,
    modelo de dados (se aplicável) e decisões com trade-offs.
    A entrega será implementada na stack {stack}, usando apenas
    {libs_permitidas} — não proponha outras tecnologias.
    Limite a spec a no máximo 150 linhas, focando no essencial para implementar.

    Separe a spec em DUAS seções com estes títulos exatos:
    "## Requisitos" — só o que o pedido exige, com os critérios de aceite
    dele. Cada item tem de ser rastreável a uma frase do pedido; o que não é,
    não entra aqui.
    "## Decisões de implementação" — como você sugere construir: estrutura
    de arquivos, nomes, organização de estilos, padrões internos. São
    sugestões para o desenvolvedor, não obrigações: a entrega pode seguir
    outro caminho se ele cumprir os requisitos.
    Duas proibições, porque já custaram execuções inteiras: NÃO inclua
    arquivos de teste nem plano de testes na spec — a suíte é escrita por
    outro agente e verificada por execução; e NÃO transforme uma escolha de
    implementação em requisito (por exemplo, "nenhuma cor em CSS global",
    quando o pedido só exige a página legível no tema escuro). As
    verificações por execução — testes, verificação visual, pentest — têm
    precedência sobre qualquer decisão de implementação desta spec.
  expected_output: >
    Spec técnica enxuta (máx. 150 linhas) em markdown, estritamente sobre
    "{pedido}", com as seções "## Requisitos" e "## Decisões de
    implementação", pronta para orientar a implementação.
  agent: arquiteto

# --- Crew de desenvolvimento (sequencial: backend -> frontend -> consolidação) ---
implementar_backend:
  description: >
    Implemente a parte de backend da spec abaixo escrevendo ARQUIVOS REAIS
    no workspace com a ferramenta escrever_arquivo — não descreva código em
    markdown. Stack: {stack}. Use apenas {libs_permitidas} (importar
    qualquer outra dependência fará os testes quebrarem: não há instalação
    em runtime). Coloque os módulos na raiz do workspace ou em subpastas
    com nomes claros.
    Se houver feedback de QA de uma rodada anterior, use listar_arquivos e
    ler_arquivo para conhecer o estado atual e corrija os pontos apontados
    antes de qualquer coisa.
    Spec: {spec}
    Feedback de QA (se houver): {feedback_qa}
  expected_output: >
    Manifesto dos arquivos criados/alterados (um por linha) com uma frase
    sobre o papel de cada um.
  agent: dev_backend

implementar_frontend:
  description: >
    Com base no backend implementado (manifesto no contexto anterior),
    escreva no workspace a camada de consumo como ARQUIVOS REAIS usando
    escrever_arquivo: cliente de integração e exemplos de uso, na mesma
    stack ({stack}).
    Antes de escrever, use listar_arquivos e ler_arquivo para conhecer o
    backend real — importe e chame o que existe, não invente módulos.
    Se a spec não exigir UI, entregue apenas integração e exemplos.
    Mesmas restrições de libs do backend.
  expected_output: >
    Manifesto dos arquivos de integração criados, um por linha.
  agent: dev_frontend

consolidar_entrega:
  description: >
    Inspecione a estrutura real do workspace com listar_arquivos e
    ler_arquivo e garanta uma entrega única e coerente: corrija
    inconsistências entre backend e integração editando os arquivos com
    escrever_arquivo, e escreva um README.md na raiz do workspace com a
    estrutura de arquivos e as instruções de execução.
    Escreva também `.squad/run.json` declarando como subir a aplicação como
    servidor HTTP, para o pipeline de segurança atacá-la. Formato exato:
    {exemplo_run_json}
    Use o comando real desta entrega (módulo e porta corretos); health_path
    é uma rota que responde com a app no ar.
  expected_output: >
    Manifesto final dos arquivos da entrega, com o README.md e o
    .squad/run.json incluídos.
  agent: tech_lead

# --- Crew de qualidade ---
escrever_testes:
  description: >
    Escreva testes REAIS no workspace usando a ferramenta escrever_arquivo,
    validando os critérios de aceite da spec contra o código real do
    projeto. Antes de escrever, use listar_arquivos e ler_arquivo para
    conhecer os módulos reais. Arquivos atuais do workspace: {arquivos}
    {instrucoes_qa}
    Importe os módulos pelos caminhos reais e não invente módulos que não
    existem. Não use dependências além de {libs_permitidas} e do próprio
    runner de testes.
    Se houver retorno de uma rodada anterior (abaixo), trate-o como
    prioridade: complemente ou corrija os testes conforme apontado, sem
    regravar os arquivos que não precisam mudar.
    Spec: {spec}
    Retorno da rodada anterior (se houver): {feedback_qa}
  expected_output: >
    Manifesto dos arquivos de teste criados, com uma linha sobre
    o que cada um cobre.
  agent: qa_engineer

revisar:
  description: >
    Os testes automatizados JÁ FORAM EXECUTADOS pelo pipeline e PASSARAM;
    a saída real do {runner} está abaixo. Sua revisão cobre o que a execução
    não pega: legibilidade, segurança e aderência do código à spec.

    REPROVAR custa uma rodada inteira de desenvolvimento, então o veredito
    tem um critério estreito. Só é BLOQUEANTE o apontamento que se encaixa em
    um destes três casos: (a) defeito que quebra comportamento documentado na
    spec ou no README da entrega, (b) falha de segurança explorável, (c)
    violação direta de um requisito do PEDIDO ORIGINAL (abaixo) ou da seção
    "## Requisitos" da spec. Todo o resto — preferência de estilo,
    refatoração, hardening defensivo, tratamento de erro que a spec não
    exige, melhoria "opcional" — vai numa seção final
    "## Sugestões (não bloqueantes)" e NÃO afeta o veredito. Se você não tem
    nenhum apontamento bloqueante, o veredito é APROVADO, mesmo que a lista
    de sugestões seja longa.

    Desviar da seção "## Decisões de implementação" da spec NÃO é
    bloqueante: são sugestões do arquiteto, e a entrega pode ter seguido
    outro caminho — muitas vezes porque uma verificação por execução
    (testes, verificação visual) exigiu. Na dúvida sobre se um item é
    requisito ou decisão, confira se ele é rastreável a uma frase do pedido
    original; se não for, é sugestão. Exigir o contrário do que a verificação
    visual ou os testes cobraram faz o laço oscilar sem convergir.

    A revisão da rodada anterior está abaixo. O código que você está lendo JÁ
    incorpora as correções que ela exigiu: não peça para desfazê-las. Se você
    discorda de uma decisão que já foi arbitrada ali, registre como sugestão
    não bloqueante — nunca como motivo de reprova. Mandar reverter o que a
    rodada anterior exigiu faz o código oscilar entre duas versões sem nunca
    convergir.

    Conclua com o veredito exato APROVADO ou REPROVADO na última linha. Ao
    reprovar, liste antes do veredito apenas as correções bloqueantes.
    Pedido original: {pedido}
    Revisão da rodada anterior: {revisao_anterior}
    Saída do {runner}: {saida_testes}
    Código (lido do workspace): {codigo}
    Spec: {spec}
  expected_output: >
    Revisão separando apontamentos bloqueantes de sugestões não bloqueantes,
    com o veredito final APROVADO/REPROVADO na última linha.
  agent: revisor_codigo

# --- Crew de decomposicao: roda uma vez, antes do fan-out ---
decompor_servicos:
  description: >
    Quebre o pedido a seguir em microsservicos: "{pedido}".
    Uma fronteira por Agregado do dominio, nao por camada tecnica: nada de
    "servico de banco" ou "servico de API". Se o pedido descreve um sistema
    unico e coeso, devolva UM servico so - decompor o que nao precisa custa
    tantas execucoes quanto ha servicos.
    Stacks disponiveis: {stacks_disponiveis}. A stack sugerida para este pedido
    e {stack}; use outra apenas se o papel do servico exigir (por exemplo, uma
    interface web).
    No maximo {max_servicos} servicos.
    Em `depende_de`, liste apenas os servicos que este CHAMA. As dependencias
    nao podem formar ciclo: se A chama B, B nao pode chamar A.
  expected_output: >
    APENAS um array JSON, sem texto antes ou depois, no formato:
    [{{"nome": "room-service", "stack": "java", "responsabilidade": "dono do
    Agregado Salas: disponibilidade e reserva", "depende_de": []}}]
    Nomes em minusculas com hifen.
  agent: arquiteto_de_sistemas

redigir_contratos:
  description: >
    Redija o contrato entre os servicos abaixo, para o pedido "{pedido}".
    Servicos decompostos:
    {servicos}

    Este contrato e congelado antes de qualquer servico ser construido, e os
    times trabalham em paralelo sem se falar depois. Tudo o que um servico
    precisa saber do outro tem de estar aqui. Para CADA chamada entre servicos,
    diga: quem chama, quem responde, o metodo e a rota HTTP, os campos da
    requisicao com tipo, os campos da resposta com tipo, e os codigos de erro.
    Nomes de campo exatos: se o consumidor espera `totalSeats` e o provedor
    devolve `capacity`, os dois passam nos proprios testes e a integracao
    quebra. Servico que nao e chamado por ninguem nao entra.
    Nao escreva codigo, nao escreva o schema do banco, nao repita a
    responsabilidade dos servicos. No maximo 80 linhas.
  expected_output: >
    Contrato em markdown, no maximo 80 linhas, com uma secao por chamada entre
    servicos, nomes de campo exatos e codigos de erro.
  agent: arquiteto_de_sistemas
