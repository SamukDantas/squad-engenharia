# Tarefas de cada crew. Placeholders {pedido}, {spec}, {codigo}, {feedback_qa}
# são preenchidos pelo nó do LangGraph via inputs do kickoff().

# --- Crew de planejamento ---
levantar_requisitos:
  description: >
    Analise o pedido a seguir e produza requisitos funcionais e não funcionais,
    com critérios de aceite verificáveis. Pedido: {pedido}
  expected_output: Lista numerada de requisitos com critérios de aceite.
  agent: analista_requisitos

definir_arquitetura:
  description: >
    Defina a solução técnica EXCLUSIVAMENTE para o pedido: "{pedido}".
    Use os requisitos levantados na tarefa anterior (fornecidos no contexto)
    como única fonte — não invente requisitos, funcionalidades ou domínios que
    não estejam neles. Se um requisito do contexto não se aplicar, ignore-o em
    vez de substituí-lo por outro tema. Produza: componentes, contratos de API,
    modelo de dados (se aplicável) e decisões com trade-offs.
    Limite a spec a no máximo 150 linhas, focando no essencial para implementar.
  expected_output: >
    Spec técnica enxuta (máx. 150 linhas) em markdown, estritamente sobre
    "{pedido}", pronta para orientar a implementação.
  agent: arquiteto

# --- Crew de desenvolvimento (sequencial: backend -> frontend -> consolidação) ---
implementar_backend:
  description: >
    Implemente a parte de backend da spec abaixo (endpoints, regras, modelos,
    configuração). Se houver feedback de QA de uma rodada anterior, corrija os
    pontos apontados antes de qualquer coisa.
    Spec: {spec}
    Feedback de QA (se houver): {feedback_qa}
  expected_output: Código backend completo com instruções de execução.
  agent: dev_backend

implementar_frontend:
  description: >
    Com base no backend implementado (contexto anterior), implemente a camada
    de consumo: cliente/integração, exemplos de uso (curl) e configuração
    necessária. Se a spec não exigir UI, entregue apenas integração e exemplos.
  expected_output: Código de integração/consumo com exemplos funcionais.
  agent: dev_frontend

consolidar_entrega:
  description: >
    Consolide o trabalho de backend e frontend (contextos anteriores) em uma
    entrega única e coerente: estrutura de arquivos, código final e instruções
    de execução. Aponte e resolva qualquer inconsistência entre as partes.
  expected_output: Entrega final consolidada, pronta para revisão de QA.
  agent: tech_lead

# --- Crew de qualidade ---
testar:
  description: >
    Escreva e execute testes que validem o código abaixo contra os critérios de
    aceite da spec. Código: {codigo}
    Spec: {spec}
  expected_output: Relatório de testes com casos cobertos e resultados.
  agent: qa_engineer

revisar:
  description: >
    Revise o código abaixo quanto a legibilidade, segurança e aderência à spec,
    considerando também o relatório de testes do contexto anterior.
    Conclua com o veredito exato APROVADO ou REPROVADO na última linha,
    listando as correções necessárias quando reprovar.
    Código: {codigo}
    Spec: {spec}
  expected_output: Revisão com apontamentos e veredito final APROVADO/REPROVADO.
  agent: revisor_codigo
